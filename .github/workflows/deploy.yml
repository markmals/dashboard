name: 🛠️ Build & Deploy to Cloudflare Workers

on:
    push:
        branches:
            - main

permissions:
    contents: read
    deployments: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        environment:
            name: production
            url: https://dashboard.malstrom.me

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            - name: ⚙️ Setup build tools
              uses: jdx/mise-action@v2

            - name: 🧰 Set cache path
              run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗄️ Cache dependencies
              uses: actions/cache@v3
              with:
                  path: ${{ env.PNPM_STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚒️ Build website
              run: mise run --force build

            - name: ☁️ Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v3.14.1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  command: deploy --config build/server/wrangler.json
