name: 🛠️ Build & Deploy to Cloudflare Pages

on:
    push:
        branches:
            - main

permissions:
    contents: read
    deployments: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        environment:
            name: production
            url: https://dashboard.malstrom.me

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            - name: ⚙️ Setup build tools
              uses: jdx/mise-action@v2

            - name: 🧰 Set cache path
              run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗄️ Cache dependencies
              uses: actions/cache@v3
              with:
                  path: ${{ env.PNPM_STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🗄️ Cache build output
              uses: actions/cache@v3
              with:
                  path: build
                  key: >-
                      "${{ runner.os }}-build-${{ hashFiles(
                        'pnpm-lock.yaml',
                        'pnpm-workspace.yaml',
                        'package.json',
                        'tsconfig.json',
                        'tsconfig.*.json',
                        'react-router.config.ts',
                        'vite.config.ts',
                        'worker-configuration.d.ts',
                        'app/**/*.ts',
                        'app/**/*.tsx',
                        'app/**/*.css',
                        'app/**/*.json',
                        'app/**/*.md',
                        'app/**/*.mdx'
                      ) }}"

            - name: ⏰ Bump build output timestamps
              run: |
                  if [ -d build ]; then
                    touch build
                    find build -exec touch {} +
                  fi

            - name: ⚒️ Build website
              run: mise run build

            - name: ☁️ Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v3.14.1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  command: deploy --config build/server/wrangler.json
