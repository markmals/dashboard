[tools]
node = "24"
pnpm = "latest"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[hooks]
postinstall = """
if [ "$CI" = "true" ]; then
  exit 0
fi

pnpm install
mise run typegen:*
"""

[tasks.dev]
description = "Run the development server"
run = "vite dev --host"

[tasks.build]
description = "Build the app"
sources = [
    "pnpm-lock.yaml",
    "react-router.config.ts",
    "vite.config.ts",
    "wrangler.jsonc",
    "tsconfig.ts",
    "tsconfig.*.ts",
    "worker-configuration.d.ts",
    "app/**/*.{ts,tsx,css,json,md,mdx}",
    "workers/**/*.{ts,tsx}",
]
run = "vite build"

[tasks.preview]
description = "Preview the built application"
depends = "build"
run = "wrangler dev --config build/server/wrangler.json"

[tasks.deploy]
description = "Deploy to Cloudflare Workers"
depends = "build"
confirm = "Are you sure you want to deploy this app to Cloudflare Workers?"
run = "wrangler deploy --config build/server/wrangler.json"

[tasks.fmt]
description = "Format the entire project with Oxfmt"
run = "oxfmt"

[tasks.lint]
description = "Lint the entire project with Oxlint"
run = "oxlint --fix"

[tasks.check]
description = "Format and lint the entire project"
depends = ["fmt", "lint"]

[tasks.icons]
description = "Rebuild the Primaries icon sprite subset from the upstream sprite"
sources = ["scripts/build-icons.ts", "scripts/primaries-full.svg"]
run = "node scripts/build-icons.ts"

[tasks."tv:refresh"]
description = "Re-hydrate TV show airing status, season counts, and premiere dates from TMDb"
run = "TMDB_API_KEY=$(op read 'op://Private/TMDb API Key/credential') node scripts/refresh-tv.ts"

[tasks."typegen:cloudflare"]
description = "Generate types for Cloudflare bindings"
sources = ["wrangler.jsonc"]
run = "wrangler types"

[tasks."typegen:react-router"]
description = "Generate types for React Router routes"
sources = ["react-router.config.ts", "vite.config.ts", "app/**/*.{ts,tsx}"]
run = "react-router typegen"

[tasks.typecheck]
description = "Typecheck the entire project"
depends = "typegen:*"
run = "tsc -b --noEmit"
