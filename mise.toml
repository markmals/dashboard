[tools]
node = "lts"
bun = "latest"

[tasks.dev]
description = "Run the Vite development server"
run = "bun x vite dev --host"

[tasks.build]
description = "Build the app using Vite"
sources = [
  "package-lock.json",
  "react-router.config.ts",
  "vite.config.ts",
  "tsconfig.ts",
  "tsconfig.*.ts",
  "worker-configuration.d.ts",
  "app/**/*.{ts,tsx,css,json,md}",
]
outputs = ["build"]
run = "bun x vite build"

[tasks.preview]
description = "Preview the built application"
depends = "build"
run = "bun x vite preview"

[tasks.deploy]
description = "Deploy to Cloudflare Workers"
depends = "build"
confirm = "Are you sure you want to deploy this app to Cloudflare Workers?"
run = "bun x wrangler deploy"

[tasks.fmt]
description = "Format the entire project using Prettier"
run = "bun x prettier -w ."

[tasks."typegen:cloudflare"]
description = "Generate types for Cloudflare bindings"
sources = ["wrangler.jsonc"]
outputs = ["worker-configuration.d.ts"]
run = "bun x wrangler types"

[tasks."typegen:react-router"]
description = "Generate types for React Router routes"
sources = ["react-router.config.ts", "vite.config.ts", "app/**/*.{ts,tsx}"]
outputs = [".react-router"]
run = "bun x react-router typegen"

[tasks.typecheck]
description = "Typecheck the entire project using tsgo"
depends = "typegen:*"
run = "bun x tsgo --noEmit"

[tasks.postinstall]
description = "Generate types after npm installation"
run = """
  if [ -z \"$GITHUB_ACTIONS\" ]; then
    mise run typegen:*
  else
    echo '✅ Skipping typegen in CI'
  fi
"""