[tools]
node = "lts"
bun = "latest"
dprint = "latest"
claude = "latest"
"npm:wrangler" = "latest"
"npm:@typescript/native-preview" = "latest"
"npm:rolldown-vite" = "latest"

[settings.npm]
bun = true

[tasks.dev]
description = "Run the development server"
run = "vite dev --host"

[tasks.build]
description = "Build the app"
sources = [
    "bun.lock",
    "react-router.config.ts",
    "vite.config.ts",
    "tsconfig.ts",
    "tsconfig.*.ts",
    "worker-configuration.d.ts",
    "app/**/*.{ts,tsx,css,json,md}",
]
outputs = ["build"]
run = "vite build"

[tasks.preview]
description = "Preview the built application"
depends = "build"
run = "vite preview"

[tasks.deploy]
description = "Deploy to Cloudflare Workers"
depends = "build"
confirm = "Are you sure you want to deploy this app to Cloudflare Workers?"
run = "wrangler deploy"

[tasks.fmt]
description = "Format the entire project"
run = "dprint fmt"

[tasks.lint]
description = "Lint the entire project"
# run = "eslint"

[tasks."typegen:cloudflare"]
description = "Generate types for Cloudflare bindings"
sources = ["wrangler.jsonc"]
outputs = ["worker-configuration.d.ts"]
run = "wrangler types"

[tasks."typegen:react-router"]
description = "Generate types for React Router routes"
sources = ["react-router.config.ts", "vite.config.ts", "app/**/*.{ts,tsx}"]
outputs = [".react-router"]
run = "bunx react-router typegen"

[tasks.typecheck]
description = "Typecheck the entire project"
depends = "typegen:*"
run = "tsgo --noEmit"

[tasks.postinstall]
description = "Generate types after npm package installation"
run = """
  if [ -z \"$GITHUB_ACTIONS\" ]; then
    mise run typegen:*
  else
    echo '✅ Skipping typegen in CI'
  fi
"""
